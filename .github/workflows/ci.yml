name: ci

# 统一测试闸（add-ci-and-provisioning）。语义与 scripts/ci-local.sh 等价；
# 托管执行器不可用期间以本地闸为准（见 docs/debt-ledger.md DEBT-CI）。

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 渲染/时长探针类测试需要系统 ffmpeg（与 canonical Dockerfile 的 apt 层
      # 同口径）；Ubuntu runner 默认不带。apt 源偶发抖动（run 42224154782 卡
      # update 15min 撞 job 超时），加超时+重试兜住。
      - name: Install system ffmpeg
        run: >
          sudo apt-get update -qq
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20
          && sudo apt-get install -y --no-install-recommends
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=20
          ffmpeg

      - name: Install mcp-server (editable, dev extras)
        run: python -m pip install -q -e "mcp-server[dev]"

      # browser_utils.py 顶层 import patchright；node 侧 confirm_gate 哨兵
      # 语义测试会 spawn python3 导入它（只测闸逻辑，不需要浏览器二进制）。
      - name: Install patchright (import-time dep of browser_utils)
        run: python -m pip install -q patchright

      # tts-synthetic-captions.test.mjs（whisper 对齐批次）require 了本机
      # 绝对路径 @remotion/captions；CI 无该路径。按 remotion-app/package.json
      # 钉的同版本在 runner 垫出同路径兜底（不改测试文件——治本须改仓内相对
      # 路径 + 缺依赖时 skip，归并发会话归属批次）。
      - name: Shim hardcoded @remotion/captions path (owning-session TODO)
        run: |
          sudo mkdir -p /Users/chengsishi/VAAS/remotion-app
          sudo npm install --silent --no-save --prefix /Users/chengsishi/VAAS/remotion-app @remotion/captions@4.0.489

      - name: pytest mcp-server
        run: python -m pytest -q mcp-server/tests

      - name: node tests (TTS helpers + publish-common)
        run: node --test tests/*.test.mjs .agents/skills/_shared/publish/publish-common.test.mjs

      - name: registry consistency
        run: python .agents/skills/fd-vaas-login/scripts/check-registry-consistency.py

      - name: Dockerfile single-source drift
        run: cmp -s Dockerfile deploy/mcp-server.Dockerfile

  build-image:
    # 测试闸红则镜像构建跳过（needs 即闸）。仅构建验证，推送仍是部署侧手动通道。
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build hosted image (no push)
        run: docker build -f deploy/mcp-server.Dockerfile -t "vaas-mcp-server:${GITHUB_SHA::7}" .
